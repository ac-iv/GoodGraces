<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console | Good Graces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none !important}   /* must outrank #login{display:flex} and .btn{display:inline-flex} */
:root{
  --ink:#111110; --ink-2:#4A4642; --ink-3:#928A82;
  --line:rgba(17,17,16,.10); --ember:#FF6B52; --ok:#2E7D52;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --serif:"Instrument Serif",Georgia,serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
body{
  font-family:var(--sans); color:var(--ink); min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(255,255,255,.7), transparent 35%),
    radial-gradient(circle at bottom right, rgba(210,194,174,.45), transparent 35%),
    linear-gradient(to bottom,#f7f4ef,#ece5dc);
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.4;
  background-image:linear-gradient(rgba(0,0,0,.04) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(0,0,0,.04) 1px,transparent 1px);
  background-size:60px 60px;
}
::selection{background:#111;color:#fff}

.soft-card{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:30px;box-shadow:0 15px 40px rgba(0,0,0,.05)}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:8px}
.inp{
  font-family:var(--sans);font-size:15px;color:var(--ink);width:100%;
  background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;transition:all .2s var(--ease);
}
.inp:focus{outline:none;background:#fff;border-color:var(--ink);box-shadow:0 0 0 3px rgba(17,17,16,.07)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.55}
select.inp{appearance:none;-webkit-appearance:none;cursor:pointer}
.selwrap{position:relative}
.selwrap::after{content:"";position:absolute;right:18px;top:50%;pointer-events:none;width:7px;height:7px;
  border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:translateY(-70%) rotate(45deg)}
.hint{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--ink-3);margin-top:7px;line-height:1.5}
.hint.warn{color:#9C3418}

.btn{font-family:var(--sans);font-size:15px;font-weight:600;padding:15px 26px;border-radius:999px;
  border:1px solid transparent;cursor:pointer;transition:transform .2s var(--ease),opacity .2s var(--ease);
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.dark{background:var(--ink);color:#fff}
.btn.ember{background:var(--ember);color:#111}
.btn.ghost{background:rgba(255,255,255,.8);color:var(--ink);border-color:var(--line)}
.btn.w{width:100%}
.btn.sm{padding:11px 18px;font-size:13.5px}

.wrap{position:relative;z-index:10;max-width:1400px;margin:0 auto;padding:28px 24px 80px}

/* login */
#login{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#login .head{text-align:center;margin-bottom:36px}
#login .head .k{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--ink-3);line-height:1}
#login .head h1{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1}
.err{color:#D33A1F;font-size:13.5px;font-weight:500;margin-top:4px}

/* header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;
  background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:999px;padding:14px 26px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.topbar .l{display:flex;align-items:center;gap:14px}
.topbar .nm{font-weight:700;letter-spacing:-.03em;font-size:17px}
.topbar .div{color:rgba(0,0,0,.22)}
.topbar .sub{font-size:14px;color:var(--ink-2)}
.topbar .r{display:flex;align-items:center;gap:20px;font-size:13.5px}
.topbar button{background:none;border:0;font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--ink-3);cursor:pointer}
.topbar button:hover{color:var(--ink)}

.cols{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:1080px){.cols{grid-template-columns:1fr}}
.pad{padding:30px}

/* template picker */
.tpl{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
.tpl button{
  text-align:left;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:20px;
  padding:16px 18px;cursor:pointer;font-family:var(--sans);transition:all .22s var(--ease);
}
.tpl button:hover{border-color:rgba(17,17,16,.2);transform:translateY(-2px)}
.tpl button[data-on="1"]{background:var(--ink);border-color:var(--ink)}
.tpl .trow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tpl .t{font-size:16px;font-weight:700;letter-spacing:-.02em;display:block}
.tpl .d{font-size:13px;color:var(--ink-3);margin-top:3px;display:block;line-height:1.45}
.tpl button[data-on="1"] .t{color:#fff}
.tpl button[data-on="1"] .d{color:rgba(255,255,255,.6)}
.tbadge{flex:0 0 auto;font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;
  padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3);white-space:nowrap}
.tbadge.full{background:rgba(255,107,82,.1);border-color:rgba(255,107,82,.28);color:#9C3418}
.tbadge.ref{background:rgba(46,125,82,.1);border-color:rgba(46,125,82,.28);color:#1E5537}
.tbadge.bulk{background:rgba(58,110,214,.1);border-color:rgba(58,110,214,.28);color:#274C97}
.tpl button[data-on="1"] .tbadge{border-color:rgba(255,255,255,.22);color:rgba(255,255,255,.7);background:rgba(255,255,255,.08)}

.rule{height:1px;background:var(--line);margin:24px 0}
.fields > div{margin-bottom:18px}

/* status */
.status{margin-top:16px;padding:14px 16px;border-radius:14px;font-size:13.5px;line-height:1.5}
.status[hidden]{display:none}
.status.good{background:rgba(46,125,82,.08);border:1px solid rgba(46,125,82,.3);color:#1E5537}
.status.bad{background:rgba(211,58,31,.07);border:1px solid rgba(211,58,31,.28);color:#8C2915}
.status code{font-family:var(--mono);font-size:12px}

/* preview */
.pvhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 28px 0}
.seg{display:flex;gap:4px;background:rgba(17,17,16,.05);border-radius:999px;padding:4px}
.seg button{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-3);background:none;
  border:0;border-radius:999px;padding:7px 15px;cursor:pointer;transition:.2s var(--ease)}
.seg button[data-on="1"]{background:var(--ink);color:#fff}
.env{padding:18px 28px 0}
.envrow{display:flex;gap:10px;font-size:13.5px;line-height:1.6;padding:6px 0;border-bottom:1px solid var(--line)}
.envrow .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);width:70px;flex:0 0 70px;padding-top:4px}
.envrow .v{min-width:0;word-break:break-word}
.envrow .v.e{color:var(--ink-3);font-style:italic}
.frame-wrap{padding:22px 28px 28px;display:flex;justify-content:center}
#frame{width:100%;max-width:620px;height:720px;border:1px solid var(--line);border-radius:20px;background:#fff;transition:max-width .3s var(--ease)}
#frame.mob{max-width:390px}

/* log */
.logwrap{overflow-x:auto;padding:4px 30px 30px}
table.log{width:100%;border-collapse:collapse;font-size:13.5px}
table.log th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);text-align:left;padding:0 14px 12px 0;font-weight:400;white-space:nowrap;
  border-bottom:1px solid var(--line)}
table.log td{padding:14px 14px 14px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
table.log tr:hover td{background:rgba(17,17,16,.02)}
table.log .when{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
table.log .who{white-space:nowrap;color:var(--ink-2)}
table.log .subj{color:var(--ink-2);max-width:280px}
.tag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;white-space:nowrap}
.tag.sent{background:rgba(46,125,82,.12);color:#1E5537}
.tag.draft{background:rgba(17,17,16,.07);color:var(--ink-2)}
.tag.test{background:rgba(255,107,82,.14);color:#9C3418}
.logempty{padding:60px 30px 70px;text-align:center;color:var(--ink-3);font-size:14.5px;line-height:1.6}
table.log .actbtn{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink-2);background:rgba(255,255,255,.7);
  border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap;transition:.18s var(--ease)}
table.log .actbtn:hover{border-color:rgba(17,17,16,.28);color:var(--ink);transform:translateY(-1px)}

/* status pill + select (shared: activity + contacts) */
.st{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.st-new{background:rgba(17,17,16,.06);color:var(--ink-2);border-color:rgba(17,17,16,.08)}
.st-contacted{background:rgba(255,107,82,.12);color:#9C3418;border-color:rgba(255,107,82,.24)}
.st-replied{background:rgba(58,110,214,.12);color:#274C97;border-color:rgba(58,110,214,.24)}
.st-meeting{background:rgba(140,90,214,.13);color:#5A3A97;border-color:rgba(140,90,214,.26)}
.st-active{background:rgba(46,125,82,.13);color:#1E5537;border-color:rgba(46,125,82,.28)}
.st-notnow{background:rgba(190,150,20,.15);color:#7A5E10;border-color:rgba(190,150,20,.3)}
.st-passed{background:rgba(17,17,16,.05);color:var(--ink-3);border-color:rgba(17,17,16,.08)}
.stsel{position:relative;display:inline-block}
.stsel select{appearance:none;-webkit-appearance:none;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;border:1px solid transparent;border-radius:999px;padding:5px 26px 5px 11px;cursor:pointer;
  background-color:rgba(17,17,16,.06);color:var(--ink-2);transition:.15s var(--ease)}
.stsel::after{content:"";position:absolute;right:11px;top:50%;pointer-events:none;width:5px;height:5px;
  border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-70%) rotate(45deg);opacity:.5}
.stsel.st-new select{background-color:rgba(17,17,16,.06);color:var(--ink-2)}
.stsel.st-contacted select{background-color:rgba(255,107,82,.14);color:#9C3418}
.stsel.st-replied select{background-color:rgba(58,110,214,.14);color:#274C97}
.stsel.st-meeting select{background-color:rgba(140,90,214,.15);color:#5A3A97}
.stsel.st-active select{background-color:rgba(46,125,82,.15);color:#1E5537}
.stsel.st-notnow select{background-color:rgba(190,150,20,.17);color:#7A5E10}
.stsel.st-passed select{background-color:rgba(17,17,16,.05);color:var(--ink-3)}

/* log tabs */
.ltabs{display:flex;gap:4px;background:rgba(17,17,16,.05);border-radius:999px;padding:4px}
.ltabs button{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-3);background:none;border:0;
  border-radius:999px;padding:8px 18px;cursor:pointer;transition:.2s var(--ease)}
.ltabs button[data-on="1"]{background:var(--ink);color:#fff}

/* contacts */
.cbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:0 30px 4px}
.cbar .csearch{flex:1;min-width:180px}
.cfilters{display:flex;gap:6px;flex-wrap:wrap;padding:14px 30px 6px}
.cfilters button{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  background:rgba(255,255,255,.6);border:1px solid var(--line);color:var(--ink-3);border-radius:999px;
  padding:6px 12px;cursor:pointer;transition:.15s var(--ease)}
.cfilters button:hover{border-color:rgba(17,17,16,.22);color:var(--ink)}
.cfilters button[data-on="1"]{background:var(--ink);border-color:var(--ink);color:#fff}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:16px 30px 30px}
.ccard{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:22px;padding:22px 22px 18px;
  display:flex;flex-direction:column;gap:2px;transition:.2s var(--ease)}
.ccard:hover{border-color:rgba(17,17,16,.16);box-shadow:0 12px 30px -18px rgba(0,0,0,.3)}
.ccard .chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:2px}
.ccard .cname{font-size:18px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.ccard .cpastor{font-size:13.5px;color:var(--ink-2);margin-bottom:12px}
.ccard .cmeta{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.ccard .crow{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--ink-2);min-width:0}
.ccard .crow .ci{flex:0 0 13px;color:var(--ink-3)}
.ccard .crow a{color:var(--ink-2);text-decoration:none;word-break:break-all}
.ccard .crow a:hover{color:var(--ink);text-decoration:underline}
.ccard .cnote{width:100%;font-family:var(--sans);font-size:12.5px;color:var(--ink-2);background:rgba(17,17,16,.03);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical;min-height:0;line-height:1.5;margin-bottom:12px}
.ccard .cnote:focus{outline:none;background:#fff;border-color:var(--ink)}
.ccard .cnote::placeholder{color:var(--ink-3)}
.ccard .cfoot{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:auto;padding-top:4px}
.ccard .cuse{font-family:var(--sans);font-size:12px;font-weight:600;color:#fff;background:var(--ink);border:0;
  border-radius:999px;padding:8px 15px;cursor:pointer;transition:.18s var(--ease)}
.ccard .cuse:hover{transform:translateY(-1px)}
.ccard .cdel{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  background:none;border:0;cursor:pointer}
.ccard .cdel:hover{color:#C33A1F}
.cempty{grid-column:1/-1;padding:56px 20px;text-align:center;color:var(--ink-3);font-size:14.5px;line-height:1.7}

/* add-contact form */
.caddwrap{padding:0 30px 20px}
.cadd{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:22px;padding:22px 22px 6px}
.cadd .cgridf{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.cadd .cgridf{grid-template-columns:1fr}.cgrid{grid-template-columns:1fr}}
.cadd .full{grid-column:1/-1}
.cadd .inp{padding:12px 14px;border-radius:12px;font-size:14px}
.cadd .arow{display:flex;justify-content:flex-end;gap:10px;padding:14px 0 8px;grid-column:1/-1}

/* email-viewer modal */
#modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
#modal[data-on="1"]{display:flex}
#modal .scrim{position:absolute;inset:0;background:rgba(17,17,16,.44);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#modal .sheet{position:relative;z-index:1;background:#fff;border-radius:26px;width:100%;max-width:680px;max-height:88vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.55)}
#modal .mhead{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
#modal .mtitle{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
#modal .msub{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.5;word-break:break-word}
#modal .mx{flex:0 0 auto;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.7);
  font-size:17px;color:var(--ink-2);cursor:pointer;line-height:1;transition:.18s var(--ease)}
#modal .mx:hover{border-color:var(--ink);color:var(--ink)}
#modal .mctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px 26px;border-bottom:1px solid var(--line);background:rgba(17,17,16,.015)}
#modal .mctl .mlbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
#modal .mbody{overflow:auto;padding:20px 26px;background:#EDECEA}
#modal iframe{width:100%;height:440px;border:1px solid var(--line);border-radius:16px;background:#fff}
#modal .mnote{padding:16px 26px 22px;border-top:1px solid var(--line)}
#modal .mnote textarea{width:100%;font-family:var(--sans);font-size:13.5px;color:var(--ink);background:rgba(255,255,255,.72);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;resize:vertical;min-height:64px;line-height:1.55}
#modal .mnote textarea:focus{outline:none;background:#fff;border-color:var(--ink)}

#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--ink);color:#fff;
  font-size:14px;font-weight:500;padding:14px 24px;border-radius:999px;opacity:0;pointer-events:none;
  transition:.25s var(--ease);z-index:150;box-shadow:0 18px 40px -14px rgba(0,0,0,.5)}
#toast[data-on="1"]{opacity:1;transform:translate(-50%,0)}
.copybox{position:fixed;left:-9999px;top:0;width:600px}
</style>
</head>
<body>

<!-- ══════ LOGIN ══════ -->
<div id="login">
  <div class="head">
    <p class="k">Good Graces</p>
    <h1>Console</h1>
    <p id="buildLogin" style="font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:10px"></p>
  </div>
  <div class="soft-card" style="width:100%;max-width:420px;padding:38px">
    <form id="loginForm" novalidate>
      <div style="margin-bottom:20px">
        <label class="lbl" for="lgWho">Who's sending</label>
        <div class="selwrap">
          <select id="lgWho" class="inp">
            <option value="avelino">Avelino &mdash; avelino@goodgraces.app</option>
            <option value="nora">Nora &mdash; nora@goodgraces.app</option>
          </select>
        </div>
        <p class="hint">Sets the signature, the sign-off name, and the From line on the draft.</p>
      </div>
      <div style="margin-bottom:22px">
        <label class="lbl" for="lgKey">Passcode</label>
        <input type="password" id="lgKey" class="inp" placeholder="••••••••" autocomplete="off">
      </div>
      <div style="margin-bottom:22px" id="lgKeyWrap" hidden>
        <label class="lbl" for="lgSecret">Send key</label>
        <input type="password" id="lgSecret" class="inp" placeholder="SHARED_SECRET" autocomplete="off">
        <p class="hint">mXl5zBtaga2ed2q3PjssScYUavVw7uhAWxhE1fux</p>
      </div>
      <p id="lgErr" class="err" hidden></p>
      <button type="submit" class="btn dark w" style="margin-top:6px">Open console</button>
    </form>
  </div>
</div>

<!-- ══════ CONSOLE ══════ -->
<div class="wrap" id="app" hidden>

  <div class="topbar">
    <div class="l">
      <span class="nm">Good Graces</span>
      <span class="div">|</span>
      <span class="sub">Campaign Manager</span>
    </div>
    <div class="r">
      <span style="font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)" id="buildTop"></span>
      <span style="color:var(--ink-3)" id="who">—</span>
      <button id="btnLog">Log</button>
      <button id="btnOut">Sign out</button>
    </div>
  </div>

  <div class="cols" id="composer">

    <!-- LEFT -->
    <div class="soft-card pad">
      <span class="lbl">Choose a message</span>
      <div class="tpl" id="tplList"></div>

      <div class="rule"></div>

      <span class="lbl" id="recipLbl">Recipient</span>
      <div style="margin-bottom:18px">

const $ = id => document.getElementById(id);
let KEY = "";
let ME = null;          // the PEOPLE entry of whoever is signed in
let tplIdx = 0;
let vals = {};

/* ══════════════════════════════════════════════════════════
   BULK MODE  ·  drives the generic "Interest Blast" template
   A template with bulk:true lets the Recipient box hold a whole
   comma / newline / semicolon separated list. On send we loop the
   list and fire ONE email per address — each person gets their own
   copy and never sees anyone else on the list.
   ══════════════════════════════════════════════════════════ */
const EMAIL_RE     = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const MAX_BULK     = 50;      // hard cap per blast
const BULK_DELAY_MS = 500;    // gap between sends — polite, and lets the UI paint
let bulkRemaining  = null;    // last quota figure the mailer reported

function isBulk(){ return !!(TEMPLATES[tplIdx] && TEMPLATES[tplIdx].bulk); }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function normalizeEntry(e){ const m = e.match(/<([^>]+)>/); return (m ? m[1] : e).trim(); }
function parseRecipients(raw){
  return String(raw || "")
    .split(/[,;\r\n]+/)
    .map(s => s.trim())
    .filter(Boolean)
    .map(normalizeEntry);
}
/* split a raw box into {valid, invalid, dupes}, case-insensitively deduped */
function classifyRecipients(raw){
  const seen = Object.create(null);
  const valid = [], invalid = [], dupes = [];
  parseRecipients(raw).forEach(e => {
    if (!EMAIL_RE.test(e)){ invalid.push(e); return; }
    const k = e.toLowerCase();
    if (seen[k]){ dupes.push(e); return; }
    seen[k] = 1; valid.push(e);
  });
  return { valid, invalid, dupes };
}

/* the small line under the Recipient box, bulk only */
function updateToBreak(){
  const el = $("toBreak"); if (!el) return;
  if (!isBulk()){ el.hidden = true; return; }
  el.hidden = false;
  const { valid, invalid, dupes } = classifyRecipients($("fTo").value);
  if (!valid.length && !invalid.length && !dupes.length){
    el.className = "hint";
    el.textContent = "Paste up to " + MAX_BULK + " addresses, separated by commas. Each person is emailed on their own \u2014 nobody sees the rest of the list.";
    return;
  }
  const bits = [valid.length + " ready"];
  if (invalid.length) bits.push(invalid.length + (invalid.length === 1 ? " looks off" : " look off"));
  if (dupes.length)   bits.push(dupes.length + (dupes.length === 1 ? " duplicate" : " duplicates") + " removed");
  const over = valid.length > MAX_BULK;
  let msg = bits.join("  \u00b7  ");
  if (over) msg += "  \u00b7  over the " + MAX_BULK + " max \u2014 trim it or send in batches";
  if (invalid.length) msg += "  \u00b7  skipping: " + invalid.slice(0, 3).join(", ") + (invalid.length > 3 ? "\u2026" : "");
  el.className = "hint" + (over || invalid.length ? " warn" : "");
  el.textContent = msg;
}

/* swap the composer chrome when the template changes (single <-> bulk) */
function applyComposerMode(){
  const bulk = isBulk();
  const to = $("fTo");
  if (to){
    to.placeholder = bulk ? ("Paste up to " + MAX_BULK + " emails, separated by commas") : "pastor@church.org";
    to.setAttribute("type", bulk ? "text" : "email");   // no <form> here, so this is purely cosmetic
  }
  const rl = $("recipLbl"); if (rl) rl.textContent = bulk ? "Recipients" : "Recipient";
  const eml = $("btnEml");  if (eml) eml.hidden = bulk;  // a 50-way .eml draft makes no sense
  const send = $("btnSend");
  if (send && !bulk && ENABLE_DIRECT_SEND) send.textContent = "Send directly";
  updateToBreak();
}

/* ── template list ─────────────────────────────── */
function buildTemplates(){
  const badgeCls = t => t.tag === "Full design" ? "full" : (t.tag === "Referral" ? "ref" : (t.tag === "Bulk" ? "bulk" : ""));
  $("tplList").innerHTML = TEMPLATES.map((t,i) =>
    '<button type="button" data-i="'+i+'" data-on="0">' +
      '<span class="trow"><span class="t">'+t.name+'</span>' +
      (t.tag ? '<span class="tbadge '+badgeCls(t)+'">'+t.tag+'</span>' : '') + '</span>' +
      '<span class="d">'+t.desc+'</span>' +
    '</button>').join("");
  $("tplList").querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => selectTemplate(Number(b.dataset.i)));
  });
}

function selectTemplate(i){
  tplIdx = i;
  vals = {};
  $("tplList").querySelectorAll("button").forEach(b => {
    b.dataset.on = Number(b.dataset.i) === i ? "1" : "0";
  });

  const t = TEMPLATES[i];

  $("fields").innerHTML = t.fields.map(f => {
    const tag = f.type === "textarea"
      ? '<textarea id="f_'+f.key+'" class="inp" placeholder="'+(f.placeholder||"")+'"></textarea>'
      : '<input type="text" id="f_'+f.key+'" class="inp" placeholder="'+(f.placeholder||"")+'" autocomplete="off">';
    return '<div><label class="lbl" for="f_'+f.key+'">'+f.label+
           (f.required ? '' : ' <span style="text-transform:none;letter-spacing:0;font-family:var(--sans)">— optional</span>')+
           '</label>'+tag+(f.hint ? '<p class="hint">'+f.hint+'</p>' : '')+'</div>';
  }).join("");

  t.fields.forEach(f => {
    $("f_"+f.key).addEventListener("input", e => { vals[f.key] = e.target.value; render(); });
  });

  $("fSubj").innerHTML = t.subjects.map((s,n) => '<option value="'+n+'">'+s+'</option>').join("")
    + '<option value="custom">Write my own…</option>';
  $("subjCustomWrap").hidden = true;

  $("status").hidden = true;
  applyComposerMode();
  render();
}

$("fSubj").addEventListener("change", () => {
  $("subjCustomWrap").hidden = $("fSubj").value !== "custom";
  render();
});
$("fSubjCustom").addEventListener("input", render);
$("fTo").addEventListener("input", render);

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function subjectLine(){
  const t = TEMPLATES[tplIdx];
  if ($("fSubj").value === "custom") return $("fSubjCustom").value.trim();
  let s = t.subjects[Number($("fSubj").value)] || "";
  t.fields.forEach(f => {
    s = s.split("{{"+f.key+"}}").join(vals[f.key] || f.fallback || "");
  });
  return s.trim();
}

function buildHtml(){
  const t = TEMPLATES[tplIdx];
  let html = t.html;

  t.fields.forEach(f => {
    if (f.block){
      const v = (vals[f.key] || "").trim();
      const out = v
        ? v.split(/\n\s*\n/).map(p => f.block.replace("{{content}}", esc(p).replace(/\n/g,"<br>"))).join("\n")
        : "";
      html = html.split("{{"+f.key+"}}").join(out);
    } else {
      html = html.split("{{"+f.key+"}}").join(esc(vals[f.key] || "[" + f.label + "]"));
    }
  });

  html = html.split("{{sender_name}}").join(esc(ME.name));
  html = html.split("{{sender_first}}").join(esc(ME.first));
  html = html.split("{{sender_email}}").join(esc(ME.email));
  html = html.split("{{sender_title}}").join(esc(ME.title));
  return html;
}

function ready(){
  const t = TEMPLATES[tplIdx];
  if (t && t.bulk){
    const { valid } = classifyRecipients($("fTo").value);
    return valid.length > 0 && valid.length <= MAX_BULK && !!subjectLine();
  }
  const to = $("fTo").value.trim();
  const okFields = t.fields.every(f => !f.required || (vals[f.key] || "").trim());
  return EMAIL_RE.test(to) && okFields && !!subjectLine();
}

function render(){
  const html = buildHtml();
  $("frame").srcdoc = html;

  const su = subjectLine();
  const bulk = isBulk();

  if (bulk){
    const { valid } = classifyRecipients($("fTo").value);
    $("envTo").textContent = valid.length
      ? (valid.length + (valid.length === 1 ? " recipient" : " recipients") + "  ·  each sent on its own")
      : "—";
    $("envTo").classList.toggle("e", !valid.length);
    const send = $("btnSend");
    if (send) send.textContent = valid.length
      ? ("Send to " + valid.length + (valid.length === 1 ? " recipient" : " recipients"))
      : "Send to your list";
    updateToBreak();
  } else {
    const to = $("fTo").value.trim();
    $("envTo").textContent = to || "—";
    $("envTo").classList.toggle("e", !to);
  }

  $("envSubj").textContent = su || "—";
  $("envSubj").classList.toggle("e", !su);

  const on = ready();
  ["btnSend","btnEml","btnRich","btnCopy"].forEach(id => { $(id).disabled = !on; });
}

/* Last-resort delivery: a real form POST into a hidden iframe. It is a
   browser navigation, not an XHR, so CORS never applies — but we can't
   read the response, so it can only ever report "probably sent". */
function postViaIframe(url, payload){
  return new Promise(resolve => {
    const f = document.createElement("form");
    f.method = "POST"; f.action = url; f.target = "gg_sink"; f.style.display = "none";
    Object.entries(payload).forEach(([k,v]) => {
      const i = document.createElement("input");
      i.type = "hidden"; i.name = k; i.value = String(v);
      f.appendChild(i);
    });
    document.body.appendChild(f);
    const sink = $("ggSink");
    let done = false;
    const finish = ok => { if (done) return; done = true; f.remove(); resolve(ok); };
    sink.addEventListener("load", () => finish(true), { once: true });
    setTimeout(() => finish(true), 6000);
    try { f.submit(); } catch(e){ finish(false); }
  });
}

$("btnSend").addEventListener("click", async () => {
  if (isBulk()) return runBulkSend();
  const btn = $("btnSend");
  const to  = $("fTo").value.trim();

  // Every exit path below reports something. No silent returns.
  if (!ME || !ME.api){
    say("bad", "<b>No API URL for " + (ME ? ME.first : "this sender") + ".</b> Deploy <code>gg-mailer.gs</code> under that account and put its /exec URL in the <code>api</code> field of their PEOPLE entry.");
    return;
  }
  if (!KEY){
    say("bad", "<b>No send key.</b> Sign out and enter the SHARED_SECRET from your Apps Script in the <b>Send key</b> field.");
    return;
  }
  if (!to){ say("bad", "Add a recipient address first."); return; }
  if (!subjectLine()){ say("bad", "Pick or write a subject line first."); return; }

  const payload = {
    secret:   KEY,
    to:       to,
    subject:  subjectLine(),
    html:     buildHtml(),
    from:     ME.email,
    fromName: ME.name
  };

  btn.disabled = true;
  btn.textContent = "Sending…";
  say("good", "Contacting the mailer\u2026");
  console.log("[GG] POST", ME.api, { to: to, subject: payload.subject, htmlBytes: payload.html.length });

  const clearForm = () => {
    $("fTo").value = "";
    TEMPLATES[tplIdx].fields.forEach(f => { const el = $("f_"+f.key); if (el) el.value = ""; });
    vals = {};
  };

  let handled = false;
  try {
    // 15s ceiling so a hung request can never leave you staring at "Sending…"
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);

    const res = await fetch(ME.api, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },   // simple request, no preflight
      body: JSON.stringify(payload),
      redirect: "follow",
      signal: ctrl.signal
    });
    clearTimeout(timer);

    const raw = await res.text();
    console.log("[GG] response", res.status, raw.slice(0, 300));

    let data = null;
    try { data = JSON.parse(raw); } catch(e){ /* not JSON */ }

    if (data && data.ok){
      say("good", "Sent to <b>" + to + "</b>." +
        (data.remaining_today != null ? " " + data.remaining_today + " sends left in today's quota." : "") +
        " <a href=\"#\" id=\"jumpLog\" style=\"color:inherit;text-decoration:underline\">View log</a>");
      const jl = $("jumpLog"); if (jl) jl.addEventListener("click", e => { e.preventDefault(); $("btnLog").click(); });
      noteActivity("sent", to, "contacted");
      clearForm();
      handled = true;
    } else if (data && data.error){
      say("bad", "The mailer refused it: <b>" + data.error + "</b><br>Nothing was delivered.");
      handled = true;
    } else if (raw.indexOf("<!DOCTYPE") === 0 || raw.indexOf("Google") !== -1){
      say("bad", "Google returned a sign-in page instead of your script. The deployment's access is set to <b>Anyone with a Google account</b> — change it to <b>Anyone</b> and deploy a new version.");
      handled = true;
    }
  } catch (err){
    console.warn("[GG] fetch failed:", err && err.name, err && err.message);
    if (err && err.name === "AbortError"){
      say("bad", "The mailer didn't answer within 15 seconds. Nothing was confirmed \u2014 check your Gmail <b>Sent</b> folder before resending.");
      handled = true;
    }
  }

  if (!handled){
    // fetch was blocked (almost always CORS). Deliver blind, then say so honestly.
    say("good", "Direct response was blocked \u2014 retrying another way\u2026");
    const ok = await postViaIframe(ME.api, payload);
    if (ok){
      say("good", "Submitted to the mailer, but the browser wouldn't let me read the reply. <b>Check your Gmail Sent folder</b> to confirm it went to " + to + " before you resend.");
      noteActivity("sent", to, "contacted");
      clearForm();
    } else {
      say("bad", "Couldn't reach the mailer at all. Check the /exec URL, confirm access is <b>Anyone</b>, and make sure this page is served over http(s) rather than opened from disk. <b>Create draft</b> still works.");
    }
  }

  btn.disabled = false;
  btn.textContent = "Send directly";
  render();
});

/* ══════════════════════════════════════════════════════════
   BULK SEND  ·  one email per address, fired sequentially
   Reuses the exact same mailer as a single send; the only
   difference is the loop and the per-recipient bookkeeping.
   ══════════════════════════════════════════════════════════ */

/* Send a single payload. Mirrors the single-send flow, including the
   CORS-blind iframe fallback, but returns a result instead of drawing UI. */
async function sendOne(payload){
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    const res = await fetch(ME.api, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow",
      signal: ctrl.signal
    });
    clearTimeout(timer);
    const raw = await res.text();
    let data = null; try { data = JSON.parse(raw); } catch(e){}
    if (data && data.ok)    return { outcome: "sent", remaining: data.remaining_today };
    if (data && data.error) return { outcome: "refused", detail: data.error };
    if (raw.indexOf("<!DOCTYPE") === 0 || raw.indexOf("Google") !== -1)
      return { outcome: "error", detail: "Google sign-in page returned \u2014 set the deployment to Anyone" };
    /* readable-but-unknown 200: fall through to the blind path below */
  } catch (err){
    if (err && err.name === "AbortError") return { outcome: "error", detail: "no answer within 15s" };
    /* network / CORS: fall through to the blind path below */
  }
  const ok = await postViaIframe(ME.api, payload);
  return ok ? { outcome: "blind" } : { outcome: "error", detail: "couldn't reach the mailer" };
}

function bulkProgress(i, total, sent, blind, failed, cur){
  return "Sending to your list \u2014 <b>" + (i + 1) + " of " + total + "</b>" +
    "<br><span style=\"font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--ink-2)\">" +
    sent + " sent" + (blind ? "  \u00b7  " + blind + " unverified" : "") + (failed ? "  \u00b7  " + failed + " failed" : "") +
    "  \u00b7  now: " + esc(cur) + "</span>";
}

async function runBulkSend(){
  const btn = $("btnSend");

  if (!ME || !ME.api){
    say("bad", "<b>No API URL for " + (ME ? ME.first : "this sender") + ".</b> Bulk sending goes through the mailer \u2014 deploy <code>gg-mailer.gs</code> under that account and put its /exec URL in the <code>api</code> field of their PEOPLE entry.");
    return;
  }
  if (!KEY){
    say("bad", "<b>No send key.</b> Sign out and enter the SHARED_SECRET in the <b>Send key</b> field \u2014 the mailer needs it for every send.");
    return;
  }
  if (!subjectLine()){ say("bad", "Pick or write a subject line first."); return; }

  const { valid, invalid, dupes } = classifyRecipients($("fTo").value);
  if (!valid.length){ say("bad", "No valid email addresses in the list yet."); return; }
  if (valid.length > MAX_BULK){
    say("bad", "That's " + valid.length + " addresses \u2014 the most per blast is " + MAX_BULK + ". Trim the list or send it in two batches.");
    return;
  }

  const skipNote =
    (invalid.length ? "\n\u2022 " + invalid.length + " malformed address" + (invalid.length === 1 ? "" : "es") + " will be skipped" : "") +
    (dupes.length   ? "\n\u2022 " + dupes.length + " duplicate" + (dupes.length === 1 ? "" : "s") + " removed" : "");
  if (!confirm("Send this email individually to " + valid.length + " recipient" + (valid.length === 1 ? "" : "s") + "?" +
      skipNote + "\n\nEach gets their own copy \u2014 this can't be undone.")) return;

  const subject = subjectLine();
  const html    = buildHtml();      // identical for everyone — the template is generic
  const total   = valid.length;
  let sent = 0, blind = 0, failed = 0;
  const fails = [];
  bulkRemaining = null;

  btn.disabled = true;
  ["btnEml","btnRich","btnCopy","btnTest"].forEach(id => { const e = $(id); if (e) e.disabled = true; });

  for (let i = 0; i < valid.length; i++){
    const to = valid[i];
    btn.textContent = "Sending " + (i + 1) + " / " + total + "\u2026";
    say("good", bulkProgress(i, total, sent, blind, failed, to));

    let r;
    try {
      r = await sendOne({ secret: KEY, to: to, subject: subject, html: html, from: ME.email, fromName: ME.name });
    } catch (e){ r = { outcome: "error", detail: (e && e.message) || "unknown error" }; }

    if (r.outcome === "sent"){ sent++; noteActivity("sent", to, "contacted"); }
    else if (r.outcome === "blind"){ blind++; noteActivity("sent", to, "contacted"); }
    else { failed++; fails.push(to + (r.detail ? " (" + r.detail + ")" : "")); }

    if (r && r.remaining != null) bulkRemaining = r.remaining;

    /* stop early if Gmail's daily quota is clearly spent */
    if (r.outcome === "refused" && /quota|limit|exceed/i.test(r.detail || "")){
      say("bad", "Gmail's daily send limit was hit after " + sent + " send" + (sent === 1 ? "" : "s") +
        ". The remaining " + (total - i - 1) + " weren't sent \u2014 try again tomorrow, or from the other account.");
      $("fTo").value = valid.slice(i).join(", ");   // leave the un-sent ones in the box
      finishBulk(btn);
      return;
    }

    if (i < valid.length - 1) await sleep(BULK_DELAY_MS);
  }

  const lines = [];
  lines.push("<b>Done.</b> " + sent + " sent" +
    (blind ? "  \u00b7  " + blind + " submitted (unverified)" : "") +
    (failed ? "  \u00b7  " + failed + " failed" : "") + " of " + total + ".");
  if (bulkRemaining != null) lines.push(bulkRemaining + " send" + (bulkRemaining === 1 ? "" : "s") + " left in today's quota.");
  if (blind)  lines.push("The " + blind + " unverified one" + (blind === 1 ? "" : "s") +
    " went out through the browser-blind path \u2014 check your Gmail <b>Sent</b> folder to be sure.");
  if (failed) lines.push("Didn't go: " + fails.slice(0, 5).map(esc).join("; ") +
    (fails.length > 5 ? " \u2026and " + (fails.length - 5) + " more" : "") + ".");
  if (invalid.length) lines.push("Skipped " + invalid.length + " malformed address" + (invalid.length === 1 ? "" : "es") + ".");
  lines.push('<a href="#" id="jumpLog" style="color:inherit;text-decoration:underline">View log</a>');

  say((failed && !sent && !blind) ? "bad" : "good", lines.join("<br>"));
  const jl = $("jumpLog"); if (jl) jl.addEventListener("click", e => { e.preventDefault(); $("btnLog").click(); });
  if (sent || blind) $("fTo").value = "";

  finishBulk(btn);
}

function finishBulk(btn){
  ["btnEml","btnRich","btnCopy","btnTest"].forEach(id => { const e = $(id); if (e) e.disabled = false; });
  if (btn) btn.disabled = false;
  render();   // resets the button label + re-evaluates enabled state
}

/* ══════════════════════════════════════════════════════════
   ACTIVITY + CONTACTS  ·  stored locally on this device
   Every send/draft is saved here with a full copy of the exact
   email, so you can reopen it and set a status by hand. The
   Google-Sheet log (recordLog) still fires in the background as
   a backup — this layer is what you actually work from.
   ══════════════════════════════════════════════════════════ */
const LS = { act: "gg_activity_v1", con: "gg_contacts_v1" };
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)) || []; } catch(e){ return []; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e){ console.warn("[GG] storage write blocked:", e && e.message); return false; } }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function getActivity(){ return lsGet(LS.act); }
function saveActivity(a){ return lsSet(LS.act, a); }
function getContacts(){ return lsGet(LS.con); }
function saveContacts(a){ return lsSet(LS.con, a); }
function storageOK(){ try { localStorage.setItem("__gg_probe","1"); localStorage.removeItem("__gg_probe"); return true; } catch(e){ return false; } }

/* one status pipeline, shared by activity rows and contact cards */
const STATUSES = [
  { id:"new",       label:"New" },
  { id:"contacted", label:"Contacted" },
  { id:"replied",   label:"Replied" },
  { id:"meeting",   label:"Meeting" },
  { id:"active",    label:"Active" },
  { id:"notnow",    label:"Not now" },
  { id:"passed",    label:"Passed" }
];
const STATUS_LABEL = {}; STATUSES.forEach(s => STATUS_LABEL[s.id] = s.label);
function stClass(id){ return "st-" + (STATUS_LABEL[id] ? id : "new"); }
function statusOptionsHtml(sel){
  return STATUSES.map(s => '<option value="'+s.id+'"'+(s.id===sel?' selected':'')+'>'+s.label+'</option>').join("");
}

function esc2(v){ return String(v == null ? "" : v).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtWhen(iso){
  const d = new Date(iso);
  if (isNaN(d)) return iso || "";
  return d.toLocaleDateString(undefined, { month:"short", day:"numeric" }) + "  " +
         d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
}
function siteHref(u){ u = (u||"").trim(); if(!u) return ""; return /^https?:\/\//i.test(u) ? u : "https://" + u; }

/* what the composer knows right now (unchanged shape) */
function ctx(){
  const t = TEMPLATES[tplIdx] || {};
  return { template: t.name || "", church: vals.church || "", pastor: vals.last || "", subject: subjectLine() };
}

/* Fire-and-forget backup to the Google Sheet. Never surfaced as an error. */
function recordLog(method, to, status){
  if (!ME || !ME.api || !KEY) return;
  const c = ctx();
  fetch(ME.api, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      secret: KEY, action: "log", method: method, status: status || "",
      to: to, from: ME.email,
      template: c.template, church: c.church, pastor: c.pastor, subject: c.subject
    })
  }).then(() => console.log("[GG] sheet-logged", method, to))
    .catch(e => console.warn("[GG] sheet log failed (harmless):", e.message));
}

/* Local record — the good one. Saves a full snapshot of the email. */
function noteActivity(method, to, statusHint){
  try {
    const c = ctx();
    const t = TEMPLATES[tplIdx] || {};
    let snap = ""; try { snap = buildHtml(); } catch(e){}
    const rec = {
      id: uid(), when: new Date().toISOString(),
      sender: ME ? ME.email : "", senderName: ME ? ME.name : "",
      method: method, template: c.template, templateId: t.id || "",
      to: to || "", church: c.church, pastor: c.pastor, subject: c.subject,
      status: statusHint || "new", note: "", html: snap
    };
    const arr = getActivity(); arr.unshift(rec); saveActivity(arr);
    upsertContact({ church: rec.church, pastor: rec.pastor, email: rec.to }, method === "sent" || method === "test");
    if (!$("logView").hidden){ renderActivity(); if (logTab === "con") renderContacts(); }
  } catch(e){ console.warn("[GG] activity note failed (harmless):", e); }
}

/* create or update the church's contact card whenever you reach out */
function upsertContact(info, bump){
  const email  = (info.email  || "").trim().toLowerCase();
  const church = (info.church || "").trim();
  if (!email && !church) return;
  const arr = getContacts();
  let c = (email  && arr.find(x => (x.email  || "").trim().toLowerCase() === email)) ||
          (church && arr.find(x => (x.church || "").trim().toLowerCase() === church.toLowerCase())) || null;
  const now = new Date().toISOString();
  if (c){
    if (!c.email  && info.email)  c.email  = info.email;
    if (!c.pastor && info.pastor) c.pastor = info.pastor;
    if (!c.church && church)      c.church = church;
    if (bump && (!c.status || c.status === "new")) c.status = "contacted";
    c.updatedAt = now;
  } else {
    arr.unshift({ id: uid(), church: church, pastor: info.pastor || "", email: info.email || "",
      phone: "", website: "", city: "", status: bump ? "contacted" : "new",
      notes: "", createdAt: now, updatedAt: now });
  }
  saveContacts(arr);
}

/* ── view switching ─────────────────────────────── */
function showComposer(){ $("composer").hidden = false; $("logView").hidden = true; }

let logTab = "act";
function setTab(which){
  logTab = which;
  $("tabAct").dataset.on = which === "act" ? "1" : "0";
  $("tabCon").dataset.on = which === "con" ? "1" : "0";
  $("paneAct").hidden = which !== "act";

  updateCount();

function updateCount(){
  if (logTab === "act"){ const n = getActivity().length; $("logCount").textContent = n ? (n + (n === 1 ? " send logged" : " sends logged")) : ""; }
  else { const n = getContacts().length; $("logCount").textContent = n ? (n + (n === 1 ? " church" : " churches")) : ""; }
}

$("btnLog").addEventListener("click", () => {
  $("composer").hidden = true;
  $("logView").hidden = false;
  $("caddWrap").hidden = true;
  if (!storageOK()) logSay("bad", "This browser is blocking local storage (often private-browsing or a file:// page), so activity and contacts won\u2019t be remembered between visits. Serving the page over http(s) fixes it.");
  else $("logStatus").hidden = true;
  setTab("act");
});
$("btnLogBack").addEventListener("click", showComposer);
$("tabAct").addEventListener("click", () => setTab("act"));
$("tabCon").addEventListener("click", () => setTab("con"));

function logSay(kind, msg){
  const el = $("logStatus");
  el.hidden = false;
  el.className = "status " + kind;
  el.innerHTML = msg;
}

/* ── ACTIVITY ───────────────────────────────────── */
function renderActivity(){
  const arr = getActivity();
  const body = $("logBody");
  if (!arr.length){
    body.innerHTML = '<p class="logempty">Nothing logged yet.<br>Send or draft your first email and it\u2019ll appear here \u2014 with the exact message saved, so you can reopen it anytime.</p>';
    updateCount(); return;
  }
  const rows = arr.map(a => {
    const m = (a.method || "draft").toLowerCase();
    const cls = m === "sent" ? "sent" : (m === "test" ? "test" : "draft");
    return "<tr>" +
      '<td class="when">' + esc2(fmtWhen(a.when)) + "</td>" +
      '<td><span class="tag ' + cls + '">' + esc2(a.method || "draft") + "</span></td>" +
      '<td><b>' + esc2(a.church || "\u2014") + '</b><br><span class="who">' + esc2(a.to) + "</span></td>" +
      '<td class="subj">' + esc2(a.subject) + "</td>" +
      '<td><span class="stsel ' + stClass(a.status) + '"><select data-act="' + a.id + '">' + statusOptionsHtml(a.status) + "</select></span></td>" +
      "<td>" + (a.html ? '<button class="actbtn" data-view="' + a.id + '">View email</button>' : '<span class="who" style="color:var(--ink-3)">\u2014</span>') + "</td>" +
    "</tr>";
  }).join("");
  body.innerHTML =
    '<table class="log"><thead><tr>' +
      "<th>When</th><th>How</th><th>Church / recipient</th><th>Subject</th><th>Status</th><th></th>" +
    "</tr></thead><tbody>" + rows + "</tbody></table>";
  updateCount();
}
function setActivityStatus(id, val){
  const arr = getActivity(); const a = arr.find(x => x.id === id); if (!a) return;
  a.status = val; saveActivity(arr); renderActivity();
}
$("logBody").addEventListener("change", e => { const s = e.target.closest("select[data-act]"); if (s) setActivityStatus(s.getAttribute("data-act"), s.value); });
$("logBody").addEventListener("click",  e => { const b = e.target.closest("[data-view]"); if (b) openEmail(b.getAttribute("data-view")); });

/* ── email viewer modal ─────────────────────────── */
let modalActId = null;
function openEmail(id){
  const a = getActivity().find(x => x.id === id); if (!a) return;
  modalActId = id;
  $("mTitle").textContent = a.church || "Sent email";
  $("mSub").innerHTML = esc2(a.subject || "\u2014") + "<br>" + esc2(a.to || "\u2014") + " &middot; " + esc2(fmtWhen(a.when)) + " &middot; " + esc2((a.method || "").toUpperCase());
  $("mFrame").srcdoc = a.html || "<p style='font-family:sans-serif;padding:24px;color:#888'>No saved copy of this one.</p>";
  $("mStatus").innerHTML = statusOptionsHtml(a.status);
  $("mStatusWrap").className = "stsel " + stClass(a.status);
  $("mNote").value = a.note || "";
  $("modal").dataset.on = "1";
}
function closeModal(){ $("modal").dataset.on = "0"; modalActId = null; $("mFrame").srcdoc = ""; }
$("mStatus").addEventListener("change", e => {
  if (!modalActId) return;
  setActivityStatus(modalActId, e.target.value);
  $("mStatusWrap").className = "stsel " + stClass(e.target.value);
});
$("mNote").addEventListener("input", e => {
  if (!modalActId) return;
  const arr = getActivity(); const a = arr.find(x => x.id === modalActId);
  if (a){ a.note = e.target.value; saveActivity(arr); }
});
$("mCopy").addEventListener("click", async () => {
  const a = getActivity().find(x => x.id === modalActId);
  if (!a || !a.html){ toast("No saved copy"); return; }
  try { await navigator.clipboard.writeText(a.html); toast("Email HTML copied"); }
  catch(e){ toast("Copy blocked by browser"); }
});
$("mClose").addEventListener("click", closeModal);
$("modalScrim").addEventListener("click", closeModal);
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("modal").dataset.on === "1") closeModal(); });

/* ── CONTACTS ───────────────────────────────────── */
let conFilter = "all";
function renderContacts(){
  const all = getContacts();
  const counts = {}; STATUSES.forEach(s => counts[s.id] = 0);
  all.forEach(c => { if (counts[c.status] != null) counts[c.status]++; });
  const filt = [{ id:"all", label:"All \u00b7 " + all.length }].concat(
    STATUSES.filter(s => counts[s.id] > 0).map(s => ({ id:s.id, label:s.label + " \u00b7 " + counts[s.id] })));
  $("cFilters").innerHTML = filt.map(f => '<button data-filter="' + f.id + '" data-on="' + (conFilter === f.id ? "1" : "0") + '">' + f.label + "</button>").join("");

  const q = ($("cSearch").value || "").trim().toLowerCase();
  let rows = all.filter(c => conFilter === "all" || c.status === conFilter);
  if (q) rows = rows.filter(c => ((c.church||"") + " " + (c.pastor||"") + " " + (c.city||"") + " " + (c.email||"")).toLowerCase().indexOf(q) !== -1);

  const grid = $("cGrid");
  if (!all.length){
    grid.innerHTML = '<div class="cempty">No churches yet.<br>Add one above, or they\u2019ll appear here automatically the first time you email them.</div>';
    updateCount(); return;
  }
  if (!rows.length){ grid.innerHTML = '<div class="cempty">No matches.</div>'; updateCount(); return; }
  grid.innerHTML = rows.map(cardHtml).join("");
  updateCount();
}
function cardHtml(c){
  const meta = [];
  if (c.email)   meta.push('<div class="crow"><span class="ci">&#9993;</span><a href="mailto:' + esc2(c.email) + '">' + esc2(c.email) + "</a></div>");
  if (c.phone)   meta.push('<div class="crow"><span class="ci">&#9742;</span><a href="tel:' + esc2(c.phone.replace(/[^0-9+]/g,"")) + '">' + esc2(c.phone) + "</a></div>");
  if (c.city)    meta.push('<div class="crow"><span class="ci">&#9678;</span><span>' + esc2(c.city) + "</span></div>");
  if (c.website) meta.push('<div class="crow"><span class="ci">&#8599;</span><a href="' + esc2(siteHref(c.website)) + '" target="_blank" rel="noopener">' + esc2(c.website) + "</a></div>");
  return '<div class="ccard">' +
    '<div class="chead"><div class="cname">' + esc2(c.church || "Untitled") + "</div>" +
      '<span class="stsel ' + stClass(c.status) + '"><select data-con="' + c.id + '">' + statusOptionsHtml(c.status) + "</select></span></div>" +
    (c.pastor ? '<div class="cpastor">' + esc2(c.pastor) + "</div>"
              : '<div class="cpastor" style="color:var(--ink-3)">No contact name yet</div>') +
    (meta.length ? '<div class="cmeta">' + meta.join("") + "</div>" : "") +
    '<textarea class="cnote" data-note="' + c.id + '" placeholder="Notes \u2014 how you met, what they care about\u2026">' + esc2(c.notes || "") + "</textarea>" +
    '<div class="cfoot"><button class="cuse" data-use="' + c.id + '">Use in composer</button>' +
      '<button class="cdel" data-del="' + c.id + '">Delete</button></div>' +
  "</div>";
}
function setContactStatus(id, val){
  const arr = getContacts(); const c = arr.find(x => x.id === id); if (!c) return;
  c.status = val; c.updatedAt = new Date().toISOString(); saveContacts(arr); renderContacts();
}
function setContactNote(id, val){
  const arr = getContacts(); const c = arr.find(x => x.id === id); if (!c) return;
  c.notes = val; c.updatedAt = new Date().toISOString(); saveContacts(arr);  /* no re-render: keep focus */
}
function deleteContact(id){
  const c = getContacts().find(x => x.id === id); if (!c) return;
  if (!confirm("Delete " + (c.church || "this church") + " from your contacts?")) return;
  saveContacts(getContacts().filter(x => x.id !== id));
  renderContacts();
}
function useContact(id){
  const c = getContacts().find(x => x.id === id); if (!c) return;
  showComposer();
  const toEl = $("fTo"); if (toEl) toEl.value = c.email || "";
  const chEl = $("f_church"); if (chEl){ chEl.value = c.church || ""; vals.church = c.church || ""; }
  const lastEl = $("f_last");
  if (lastEl){
    let last = "";
    if (c.pastor){
      const parts = c.pastor.replace(/^(pastor|pr\.?|ps\.?|rev\.?|reverend|fr\.?|father|dr\.?|deacon)\s+/i, "").trim().split(/\s+/);
      last = parts.length ? parts[parts.length - 1] : "";
    }
    lastEl.value = last; vals.last = last;
  }
  render();
  toast("Loaded " + (c.church || "contact") + " into the composer");
}
$("cGrid").addEventListener("change", e => { const s = e.target.closest("select[data-con]"); if (s) setContactStatus(s.getAttribute("data-con"), s.value); });
$("cGrid").addEventListener("input",  e => { const t = e.target.closest("textarea[data-note]"); if (t) setContactNote(t.getAttribute("data-note"), t.value); });
$("cGrid").addEventListener("click",  e => {
  const u = e.target.closest("[data-use]"); if (u){ useContact(u.getAttribute("data-use")); return; }
  const d = e.target.closest("[data-del]"); if (d) deleteContact(d.getAttribute("data-del"));
});
$("cSearch").addEventListener("input", renderContacts);
$("cFilters").addEventListener("click", e => { const b = e.target.closest("[data-filter]"); if (b){ conFilter = b.getAttribute("data-filter"); renderContacts(); } });

/* add-contact form */
function clearAddForm(){ ["ncChurch","ncPastor","ncEmail","ncPhone","ncCity","ncSite","ncNote"].forEach(id => { const el = $(id); if (el) el.value = ""; }); }
$("btnAddContact").addEventListener("click", () => {
  const w = $("caddWrap"); w.hidden = !w.hidden;
  if (!w.hidden){ $("logStatus").hidden = true; $("ncChurch").focus(); }
});
$("ncCancel").addEventListener("click", () => { clearAddForm(); $("caddWrap").hidden = true; });
$("ncSave").addEventListener("click", () => {
  const church = $("ncChurch").value.trim();
  const email  = $("ncEmail").value.trim();
  if (!church && !email){ logSay("bad", "Add at least a church name or an email address."); return; }
  const now = new Date().toISOString();
  const arr = getContacts();
  arr.unshift({ id: uid(), church: church, pastor: $("ncPastor").value.trim(), email: email,
    phone: $("ncPhone").value.trim(), website: $("ncSite").value.trim(), city: $("ncCity").value.trim(),
    status: "new", notes: $("ncNote").value.trim(), createdAt: now, updatedAt: now });
  saveContacts(arr);
  clearAddForm(); $("caddWrap").hidden = true; $("logStatus").hidden = true;
  renderContacts(); toast("Church added");
});

/* ── CSV export (Activity or Contacts, whichever tab you're on) ── */
function downloadCsv(csv, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast("CSV downloaded");
}
$("btnLogCsv").addEventListener("click", () => {
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  if (logTab === "con"){
    const arr = getContacts();
    if (!arr.length){ logSay("bad", "No churches to export yet."); return; }
    const head = ["church","pastor","email","phone","city","website","status","notes","updated_at"];
    const csv = [head.map(q).join(",")].concat(arr.map(c =>
      [c.church, c.pastor, c.email, c.phone, c.city, c.website, STATUS_LABEL[c.status] || c.status, c.notes, c.updatedAt].map(q).join(","))).join("\r\n");
    downloadCsv(csv, "good-graces-contacts.csv");
  } else {
    const arr = getActivity();
    if (!arr.length){ logSay("bad", "Nothing to export yet."); return; }
    const head = ["when","method","template","to","church","pastor","subject","status","note","sender"];
    const csv = [head.map(q).join(",")].concat(arr.map(a =>
      [a.when, a.method, a.template, a.to, a.church, a.pastor, a.subject, STATUS_LABEL[a.status] || a.status, a.note, a.sender].map(q).join(","))).join("\r\n");
    downloadCsv(csv, "good-graces-activity.csv");
  }
});

/* ── connection test ───────────────────────────── */
$("btnTest").addEventListener("click", async () => {
  if (!ME.api){
    say("bad", "No <code>api</code> URL set for " + ME.first + ". Add the /exec URL to their PEOPLE entry at the top of this file.");
    return;
  }
  say("good", "Checking\u2026");
  try {
    const r = await fetch(ME.api, { method: "GET" });
    const d = await r.json().catch(() => null);
    if (!d || !d.ok) { say("bad", "Reached it, but got no usable answer. Is the deployment set to <b>Anyone</b>?"); return; }

    const match = d.account === ME.email || (d.aliases || []).indexOf(ME.email) !== -1;
    say(match ? "good" : "bad",
      "Mailer is live.<br>Sends as: <code>" + d.account + "</code>" +
      "<br>Aliases: <code>" + ((d.aliases||[]).join(", ") || "none") + "</code>" +
      "<br>Quota left today: <b>" + d.remaining_today + "</b>" +
      (match ? "" : "<br><br><b>Mismatch:</b> this script belongs to <code>" + d.account +
        "</code>, but you're signed in as " + ME.email + ". Mail would go out from the wrong address \u2014 deploy a copy under that account, or add it as a verified alias in Gmail."));
  } catch (err) {
    say("bad", "Couldn't reach it: <code>" + err.message + "</code><br>Check the URL ends in <code>/exec</code>, access is <b>Anyone</b>, and this page is served over https.");
  }
});

/* ── .eml fallback ─────────────────────────────── */
function slug(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }

$("btnEml").addEventListener("click", () => {
  const eml = [
    "From: " + ME.name + " <" + ME.email + ">",
    "To: <" + $("fTo").value.trim() + ">",
    "Subject: " + subjectLine(),
    "X-Unsent: 1",
    "MIME-Version: 1.0",
    'Content-Type: text/html; charset="utf-8"',
    "", buildHtml()
  ].join("\r\n");

  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([eml], { type: "message/rfc822" }));
  a.download = (slug(vals.church) || "outreach") + ".eml";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  recordLog("draft", $("fTo").value.trim(), "draft created");
  noteActivity("draft", $("fTo").value.trim(), "new");
  toast("Draft downloaded — double-click it to open in Mail");
});

function plainOf(html){
  const d = document.createElement("div");
  d.innerHTML = html;
  return (d.textContent||"").replace(/\n{3,}/g,"\n\n").trim();
}

$("btnRich").addEventListener("click", async () => {
  const html = buildHtml();
  let ok = false;
  if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
    try {
      await navigator.clipboard.write([ new ClipboardItem({
        "text/html":  new Blob([html], {type:"text/html"}),
        "text/plain": new Blob([plainOf(html)], {type:"text/plain"})
      })]);
      ok = true;
    } catch(e){ /* fall back below */ }
  }
  if (!ok){
    const box = $("copybox");
    box.innerHTML = html;
    const r = document.createRange(); r.selectNodeContents(box);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    try { ok = document.execCommand("copy"); } catch(e){ ok = false; }
    sel.removeAllRanges(); box.innerHTML = "";
  }
  toast(ok ? "Copied — paste into a blank Gmail compose" : "Copy blocked by browser");
});

$("btnCopy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(buildHtml()); toast("HTML copied"); }
  catch(e){ toast("Copy blocked by browser"); }
});
